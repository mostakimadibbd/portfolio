<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Mostakim Adib</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .error-page { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .error-code { font-family: var(--font-mono); font-size: clamp(4rem, 18vw, 9rem); font-weight: 700; line-height: 1;
      background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .error-page h1 { margin-top: 1rem; font-size: var(--step-3); }
    .error-page p { margin-top: 0.75rem; color: var(--text-muted); }
    .error-page .hero-actions { justify-content: center; margin-top: 2rem; }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-code">404</p>
      <h1>This page does not exist</h1>
      <p>The link may be out of date, or the page may have moved.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-outline" href="/#projects">View projects</a>
      </div>
    </div>
  </main>
</body>
</html>
